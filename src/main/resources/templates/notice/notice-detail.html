<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 상세</title>
  <style>
    body {
        width: 1200px;
        height: 960px;
        margin: 0 auto;
        font-family: Arial, sans-serif;
    }
    main {
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        background: #f9f9f9;
    }
    h1 {
        text-align: center;
    }
    .info {
        margin-bottom: 20px;
    }
    .info label {
        font-weight: bold;
    }
    .button-container {
        text-align: center;
        margin-top: 20px;
    }
    .button-container a, .button-container form button {
        text-decoration: none;
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border-radius: 5px;
        border: none;
        cursor: pointer;
    }
    .button-container a:hover, .button-container form button:hover {
        background: #0056b3;
    }
    .delete-btn {
        background: #dc3545 !important;
    }
    .delete-btn:hover {
        background: #a71d2a !important;
    }
  </style>
</head>
<body>
<main>
  <h1>공지사항 상세</h1>
  <div class="info">
    <label>제목:</label> <span th:text="${notice.title}"></span>
  </div>
  <div class="info">
    <label>작성자 ID:</label> <span th:text="${notice.userId}"></span>
  </div>
  <div class="info">
    <label>작성 날짜:</label> <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
  </div>
  <div class="info">
    <label>내용:</label>
    <p th:text="${notice.content}"></p>
  </div>

  <div class="button-container">
    <!-- 수정하기 버튼 -->
    <a th:href="@{/notice/update-form/{id}(id=${notice.noticeId})}">수정하기</a>

    <!-- 삭제 버튼 -->
    <form th:action="@{/notice/delete/{id}(id=${notice.noticeId})}" method="post" style="display:inline;">
      <button type="submit" class="delete-btn" onclick="return confirm('정말 삭제하시겠습니까?');">삭제하기</button>
    </form>

    <!-- 목록으로 돌아가기 -->
    <a href="/notice/list">목록으로</a>
  </div>
</main>
</body>
</html>
